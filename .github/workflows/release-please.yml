name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:  # allow manual publish trigger from the Actions tab

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/faostat-mcp/
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install build

      - name: Build distribution
        run: python -m build

      # Install the wheel with its declared dependency ranges, exactly as users
      # get it, and run the unit tests before anything reaches PyPI.
      - name: Test built wheel
        run: |
          pip install dist/*.whl pytest pytest-asyncio respx
          mkdir -p "$RUNNER_TEMP/wheel-tests"
          cp tests/conftest.py tests/test_unit.py "$RUNNER_TEMP/wheel-tests/"
          cd "$RUNNER_TEMP/wheel-tests"
          python -m pytest -o asyncio_mode=auto test_unit.py -q

      - uses: astral-sh/setup-uv@v6

      - name: Fresh-install launch (stdio handshake via uvx)
        run: python tests/smoke_install.py uvx --from dist/*.whl faostat-mcp

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API token needed — uses OIDC Trusted Publishing.
        # Trusted publisher must be configured on PyPI:
        #   PyPI project name: faostat-mcp
        #   GitHub owner:      berba-q
        #   Repository:        faostat-mcp
        #   Workflow filename: release-please.yml   <- note: changed from publish.yml
        #   Environment:       pypi

      # MCP Registry: io.github.berba-q/* authenticates via GitHub OIDC (no secret).
      # server.json versions are bumped by release-please (extra-files).
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # The registry verifies the package on PyPI, which can lag a fresh upload.
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "Registry publish attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
